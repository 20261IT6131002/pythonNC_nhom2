[build-system]
requires = ["setuptools>=68,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "noteapp"
version = "0.1.0"
description = "A desktop note application with a pure domain and Mongo adapters."
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.2,<51",
    "keyring>=25.7,<26",
    "pillow>=10.3,<13",
    "plyer>=2.1,<3",
    "pymongo>=4.10,<5",
    "reportlab>=4.4,<5",
    "ttkbootstrap>=1.10,<2",
    "tzdata>=2025.2,<2028",
    "tzlocal>=5.3,<6",
]

[project.optional-dependencies]
dev = ["pypdf>=6,<7", "pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
noteapp = "noteapp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noteapp = ["presentation/tk/assets/icons/*.png", "presentation/tk/assets/icons/*.txt", "presentation/tk/assets/icons/*.md", "infrastructure/export/fonts/*.ttf.gz", "infrastructure/export/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires an isolated Mongo database",
    "ui: requires a working Tk display",
    "native_secret_store: explicit opt-in for a disposable native OS credential entry",
]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
